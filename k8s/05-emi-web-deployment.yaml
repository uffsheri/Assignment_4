apiVersion: apps/v1
kind: Deployment
metadata:
  name: emi-web
  namespace: emi
  labels:
    app: emi-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: emi-web
  template:
    metadata:
      labels:
        app: emi-web
    spec:
      containers:
        - name: emi-web
          image: emi-web:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: MONGO_URL
              valueFrom:
                configMapKeyRef:
                  name: emi-config
                  key: MONGO_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
