apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-init
  namespace: emi
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: mongo:7
          command: ["/bin/bash", "-c"]
          args:
            - |
              for h in mongo-0.mongo mongo-1.mongo mongo-2.mongo; do
                until mongosh --host $h --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1; do
                  echo "waiting for $h ..."; sleep 3
                done
                echo "$h is up"
              done
              mongosh --host mongo-0.mongo --quiet --eval '
                try {
                  rs.status();
                  print("replica set already initiated");
                } catch (e) {
                  printjson(rs.initiate({
                    _id: "rs0",
                    members: [
                      { _id: 0, host: "mongo-0.mongo:27017" },
                      { _id: 1, host: "mongo-1.mongo:27017" },
                      { _id: 2, host: "mongo-2.mongo:27017" }
                    ]
                  }));
                }'
              echo "waiting for a PRIMARY ..."
              until mongosh --host mongo-0.mongo --quiet --eval 'rs.status().members.some(m => m.stateStr === "PRIMARY")' | grep -q true; do sleep 3; done
              mongosh --host mongo-0.mongo --quiet --eval 'rs.status().members.forEach(m => print(m.name + " " + m.stateStr))'
